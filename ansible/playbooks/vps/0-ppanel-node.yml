# Stage 0: VPS PPanel-node Setup
# Run from repo root:
#   ansible-playbook -i ansible/inventory/vps.yml ansible/playbooks/vps/0-ppanel-node.yml --vault-password-file ansible/.vault_pass
#
# Required host vars:
#   ppanel_node_server_id
#   ppanel_node_secret_key
#
# Optional vars:
#   ppanel_node_api_host
#   ppanel_node_version
#
# Tags: deploy, packages, download, install, config, service, verify

- name: Stage 0 - VPS PPanel-node Setup
  hosts: vps_nodes
  strategy: free
  become: true
  become_method: sudo
  gather_facts: true
  gather_subset: ["min"]
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/vps_nodes.yml"
  vars:
    ppanel_node_release_api: "https://api.github.com/repos/{{ ppanel_node_release_repo }}/releases/latest"
    ppanel_node_arch_map:
      x86_64: "64"
      amd64: "64"
      aarch64: "arm64-v8a"
      arm64: "arm64-v8a"
      s390x: "s390x"
  pre_tasks:
    - name: Check connectivity
      ansible.builtin.ping:
      tags:
        - deploy

    - name: Gather architecture facts
      ansible.builtin.setup:
        gather_subset:
          - distribution
          - distribution_version
          - architecture
      tags:
        - deploy

    - name: Fail when required node variables are missing
      ansible.builtin.assert:
        that:
          - ppanel_node_server_id is defined
          - ppanel_node_secret_key is defined
          - (ppanel_node_secret_key | string | length) > 0
        fail_msg: "Set ppanel_node_server_id and ppanel_node_secret_key in vaulted host_vars before running this playbook."
      tags:
        - deploy

    - name: Resolve release tag from GitHub
      ansible.builtin.uri:
        url: "{{ ppanel_node_release_api }}"
        return_content: true
      register: ppanel_node_latest_release
      when: ppanel_node_version == "latest"
      tags:
        - deploy
        - download

    - name: Set effective ppnode version
      ansible.builtin.set_fact:
        ppanel_node_effective_version: >-
          {{
            ppanel_node_latest_release.json.tag_name
            if ppanel_node_version == "latest"
            else ppanel_node_version
          }}
        ppanel_node_arch: "{{ ppanel_node_arch_map.get(ansible_architecture, '64') }}"
      tags:
        - deploy
        - download

    - name: Set package download URL
      ansible.builtin.set_fact:
        ppanel_node_archive_url: >-
          https://github.com/{{ ppanel_node_release_repo }}/releases/download/{{ ppanel_node_effective_version }}/ppanel-node-linux-{{ ppanel_node_arch }}.zip
      tags:
        - deploy
        - download

  tasks:
    - name: Install required packages
      ansible.builtin.package:
        name:
          - unzip
          - curl
          - ca-certificates
        state: present
      tags:
        - deploy
        - packages

    - name: Create temporary download directory
      ansible.builtin.file:
        path: /tmp/ppanel-node
        state: directory
        mode: "0755"
      tags:
        - deploy
        - download

    - name: Download ppnode release archive
      ansible.builtin.get_url:
        url: "{{ ppanel_node_archive_url }}"
        dest: /tmp/ppanel-node/ppanel-node-linux.zip
        mode: "0644"
        force: true
      tags:
        - deploy
        - download

    - name: Remove previous install directory
      ansible.builtin.file:
        path: "{{ ppanel_node_install_dir }}"
        state: absent
      tags:
        - deploy
        - install

    - name: Create install and config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ppanel_node_install_dir }}"
        - "{{ ppanel_node_config_dir }}"
      tags:
        - deploy
        - install

    - name: Extract ppnode archive
      ansible.builtin.unarchive:
        src: /tmp/ppanel-node/ppanel-node-linux.zip
        dest: "{{ ppanel_node_install_dir }}"
        remote_src: true
      tags:
        - deploy
        - install

    - name: Ensure ppnode binary is executable
      ansible.builtin.file:
        path: "{{ ppanel_node_install_dir }}/ppnode"
        mode: "0755"
        state: file
      tags:
        - deploy
        - install

    - name: Copy geo data files into config directory
      ansible.builtin.copy:
        remote_src: true
        src: "{{ ppanel_node_install_dir }}/{{ item }}"
        dest: "{{ ppanel_node_config_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - geoip.dat
        - geosite.dat
      tags:
        - deploy
        - install

    - name: Render ppanel-node config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/vps/ppanel-node-config.yml.j2"
        dest: "{{ ppanel_node_config_dir }}/config.yml"
        mode: "0600"
      register: ppanel_node_config
      tags:
        - deploy
        - config

    - name: Render ppanel-node systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/vps/PPanel-node.service.j2"
        dest: "/etc/systemd/system/{{ ppanel_node_service_name }}.service"
        mode: "0644"
      register: ppanel_node_service
      tags:
        - deploy
        - service

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: ppanel_node_service.changed
      tags:
        - deploy
        - service

    - name: Enable and restart ppanel-node
      ansible.builtin.systemd:
        name: "{{ ppanel_node_service_name }}"
        enabled: true
        state: restarted
      tags:
        - deploy
        - service

    - name: Verify ppanel-node service state
      ansible.builtin.systemd:
        name: "{{ ppanel_node_service_name }}"
      register: ppanel_node_service_state
      failed_when: ppanel_node_service_state.status.ActiveState != "active"
      tags:
        - deploy
        - verify

    - name: Verify ppnode version
      ansible.builtin.command:
        cmd: "{{ ppanel_node_install_dir }}/ppnode version"
      register: ppanel_node_version_output
      changed_when: false
      tags:
        - deploy
        - verify

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "Node: {{ node_name }}"
          - "Location: {{ node_location }}"
          - "ServerID: {{ ppanel_node_server_id }}"
          - "ApiHost: {{ ppanel_node_api_host }}"
          - "Version: {{ ppanel_node_version_output.stdout | default('unknown') }}"
          - "Service: {{ ppanel_node_service_state.status.ActiveState | default('unknown') }}"
      tags:
        - deploy
