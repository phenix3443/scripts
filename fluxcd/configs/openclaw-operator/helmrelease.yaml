apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw-operator
  namespace: openclaw-operator-system
spec:
  interval: 10m
  chart:
    spec:
      chart: openclaw-operator
      version: ">=0.34.5 <0.35.0"
      sourceRef:
        kind: HelmRepository
        name: openclaw-rocks
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    livenessProbe:
      initialDelaySeconds: 180
      periodSeconds: 20
      timeoutSeconds: 5
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
